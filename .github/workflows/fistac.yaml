name: Fistac Github Action
on: [push]
jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        python-version: [3.8, 3.9]

    steps:
      - name: Set up python
        uses: actions/checkout@v7
        with:
           python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip inistall pytest

      - name: Run Tests
        run: |
          cd src
          python -m pytest addition.py
